plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mohdaie.tufaylmissionpad'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mohdaie.tufaylmissionpad'
        minSdk 26
        targetSdk 36
        versionCode 20100
        versionName '2.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
